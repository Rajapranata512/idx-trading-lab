name: IDX Trading Lab - Daily Pipeline

on:
  schedule:
    # Run after IDX market close, with retries for delayed EOD provider updates.
    # Avoid minute 00 because GitHub Actions schedules can be delayed or dropped
    # during high-load periods at the start of each hour.
    - cron: '15 10 * * 1-5' # 17:15 WIB
    - cron: '15 11 * * 1-5' # 18:15 WIB retry
    - cron: '30 12 * * 1-5' # 19:30 WIB fallback
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-run.yml'
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: idx-trading-lab-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Restore Model V2 artifacts
      uses: actions/cache@v5
      with:
        path: models/model_v2
        key: model-v2-${{ runner.os }}-${{ hashFiles('src/model_v2/**', 'config/settings.json', 'requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          model-v2-${{ runner.os }}-${{ hashFiles('src/model_v2/**', 'config/settings.json', 'requirements.txt') }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify EOD reconciliation configuration
      env:
        EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      run: |
        python -m src.cli check-eod-reconciliation-readiness

    - name: Run Daily Pipeline
      env:
        EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Ingestion, Feature Computation, Scoring, and Report Generation
        python -m src.cli run-daily

    - name: Collect Free-Tier Deferred EOD Reconciliation
      env:
        EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      run: |
        # At most one 15-ticker historical batch per Jakarta calendar day.
        python -m src.cli collect-deferred-eod-reconciliation

    - name: Export Static UI Data
      env:
        PYTHONPATH: .
      run: |
        python scripts/export_static_web.py

    - name: Commit and Push Results
      run: |
        # Results must only be published from the source/config revision that produced them.
        git fetch --no-tags origin main
        remote_sha="$(git rev-parse FETCH_HEAD)"
        if [ "$remote_sha" != "$GITHUB_SHA" ]; then
          echo "::warning title=Stale workflow base::Skipping generated artifact publish because main advanced from ${GITHUB_SHA} to ${remote_sha}."
          {
            echo "### Generated artifact publish skipped"
            echo ""
            echo "- Workflow base: \`${GITHUB_SHA}\`"
            echo "- Current main: \`${remote_sha}\`"
            echo "- Reason: results were computed from stale source/config and were not rebased."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Use a custom email to prevent Vercel from ignoring github-actions[bot] commits by default
        git config --local user.email "pipeline@idxtradinglab.local"
        git config --local user.name "IDX Lab Pipeline"
        
        # Add generated reports, web static data, AND web/reports/ for Vercel
        # Use --force to override .gitignore rules for report files
        git add --force data/ reports/ web/public_*.json web/reports/
        
        # Only commit if there are changes
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated Daily Run: $(date -u +'%Y-%m-%d')"
          if ! git push origin HEAD:main; then
            git fetch --no-tags origin main
            latest_sha="$(git rev-parse FETCH_HEAD)"
            if [ "$latest_sha" != "$GITHUB_SHA" ]; then
              echo "::warning title=Concurrent main update::Generated artifact push was skipped because main advanced to ${latest_sha}."
              {
                echo "### Generated artifact push skipped"
                echo ""
                echo "- Workflow base: \`${GITHUB_SHA}\`"
                echo "- Current main: \`${latest_sha}\`"
                echo "- Reason: main advanced during publication; stale results were not force-pushed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::error title=Artifact publish failed::Push failed while main remained at ${latest_sha}."
            exit 1
          fi
        else
          echo "No changes to commit"
        fi

    - name: Notify on Failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ IDX Trading Lab Daily Pipeline FAILED on $(date -u +'%Y-%m-%d %H:%M UTC'). Check GitHub Actions for details." \
            -d parse_mode="HTML" || true
        fi
